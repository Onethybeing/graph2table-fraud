<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="Pipeline: graph and attributes become four feature blocks, then one table, a tabular model and a fraud ranking">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6B80"/></marker>
  </defs>
  <rect width="1120" height="560" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#14202E">
    <text x="32" y="44" font-size="22" font-weight="700">One table per graph: no labels are used until the model step</text>

    <g fill="none" stroke="#5B6B80" stroke-width="1.5">
      <path d="M252 130H300"/>
      <path d="M252 400H300"/>
      <path d="M300 110V395"/>
      <path d="M300 110H326" marker-end="url(#a)"/>
      <path d="M300 205H326" marker-end="url(#a)"/>
      <path d="M300 300H326" marker-end="url(#a)"/>
      <path d="M300 395H326" marker-end="url(#a)"/>
      <path d="M646 110H680"/>
      <path d="M646 205H680"/>
      <path d="M646 300H680"/>
      <path d="M646 395H680"/>
      <path d="M680 110V395"/>
      <path d="M680 250H706" marker-end="url(#a)"/>
      <path d="M866 250H900" marker-end="url(#a)"/>
      <path d="M998 330V292" marker-end="url(#a)"/>
      <path d="M998 210V174" marker-end="url(#a)"/>
    </g>

    <g fill="#F4F6F9" stroke="#5B6B80" stroke-width="1.25">
      <rect x="32" y="84" width="220" height="92" rx="8"/>
      <rect x="32" y="354" width="220" height="92" rx="8"/>
    </g>
    <text x="52" y="120" font-size="17" font-weight="600">Transaction graph</text>
    <text x="52" y="146" font-size="14" fill="#4C5A6B">Who transacted with whom</text>
    <text x="52" y="390" font-size="17" font-weight="600">Node attributes</text>
    <text x="52" y="416" font-size="14" fill="#4C5A6B">One numeric row per account</text>

    <g fill="#EAF2FB" stroke="#3D7CC9" stroke-width="1.25">
      <rect x="326" y="72" width="320" height="76" rx="8"/>
      <rect x="326" y="167" width="320" height="76" rx="8"/>
      <rect x="326" y="262" width="320" height="76" rx="8"/>
      <rect x="326" y="357" width="320" height="76" rx="8"/>
    </g>
    <text x="344" y="102" font-size="16" font-weight="600">Raw</text>
    <text x="344" y="127" font-size="14" fill="#4C5A6B">The account's own attributes</text>
    <text x="344" y="197" font-size="16" font-weight="600">Structure</text>
    <text x="344" y="222" font-size="14" fill="#4C5A6B">Degree and PageRank</text>
    <text x="344" y="292" font-size="16" font-weight="600">Position</text>
    <text x="344" y="317" font-size="14" fill="#4C5A6B">Laplacian eigenvectors, k = 16</text>
    <text x="344" y="387" font-size="16" font-weight="600">Neighbours</text>
    <text x="344" y="412" font-size="14" fill="#4C5A6B">Mean per hop, or Beta wavelet filters</text>

    <rect x="706" y="200" width="160" height="100" rx="8" fill="#F4F6F9" stroke="#5B6B80" stroke-width="1.25"/>
    <text x="786" y="244" font-size="17" font-weight="600" text-anchor="middle">One table</text>
    <text x="786" y="270" font-size="14" fill="#4C5A6B" text-anchor="middle">Row per account</text>

    <rect x="900" y="210" width="196" height="80" rx="8" fill="#FDF0EE" stroke="#D9503F" stroke-width="2"/>
    <text x="998" y="244" font-size="17" font-weight="600" text-anchor="middle">Tabular model</text>
    <text x="998" y="268" font-size="14" fill="#4C5A6B" text-anchor="middle">XGBoost or LimiX</text>

    <rect x="900" y="330" width="196" height="76" rx="8" fill="#F4F6F9" stroke="#5B6B80" stroke-width="1.25"/>
    <text x="998" y="362" font-size="16" font-weight="600" text-anchor="middle">Labelled accounts</text>
    <text x="998" y="386" font-size="14" fill="#4C5A6B" text-anchor="middle">T-Finance test: only 100</text>

    <rect x="900" y="96" width="196" height="76" rx="8" fill="#F4F6F9" stroke="#5B6B80" stroke-width="1.25"/>
    <text x="998" y="128" font-size="16" font-weight="600" text-anchor="middle">Fraud ranking</text>
    <text x="998" y="152" font-size="14" fill="#4C5A6B" text-anchor="middle">Riskiest accounts first</text>

    <text x="32" y="510" font-size="15" fill="#4C5A6B">Blue blocks use no labels, so the table can be built once and reused for any choice of labelled accounts.</text>
  </g>
</svg>
